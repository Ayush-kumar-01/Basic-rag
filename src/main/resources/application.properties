spring.application.name=demo

server.port=8082

# OpenRouter Configuration
spring.ai.openai.base-url=https://openrouter.ai
spring.ai.openai.chat.completions-path=/api/v1/chat/completions
spring.ai.openai.embedding.embeddings-path=/api/v1/embeddings
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=openai/gpt-4o-mini

# OpenRouter Embedding Model (1536 dimensions matches MariaDB vectorstore)
spring.ai.openai.embedding.options.model=openai/text-embedding-3-small


logging.level.org.springframework.ai.chat.client.advisor=DEBUG

#db configurations
spring.datasource.url=jdbc:mariadb://localhost:3308/springai
spring.datasource.username=root
spring.datasource.password=root

#spring.ai.chat.memory.repository.jdbc.initialize-schema=ALWAYS

spring.ai.vectorstore.mariadb.initialize-schema=true
spring.ai.vectorstore.mariadb.distance-type=COSINE
spring.ai.vectorstore.mariadb.dimensions=1536